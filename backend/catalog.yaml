  - provider: gemini
    channel: [text, voice, video]
    model: gemini-3.5-flash-lite
    label: "Gemini 3.5 Flash-Lite (Google)"
    vision: true
    api: native
    reasoning_efforts: *gemini_reasoning_efforts
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    supports_prompt_cache_key: false
    builtin_tools: *gemini_builtin_tools
    pricing: { input_per_1m: 0.30, cached_input_per_1m: 0.03, output_per_1m: 2.50 }
    # Google publishes the cached rate here as $0.05, not the $0.054 an exact
    # 1.8x would give — their rounding, so their number.
    priority:
      pricing: { input_per_1m: 0.54, cached_input_per_1m: 0.05, output_per_1m: 4.50 }
      confirms: false
    extra: {}
  - provider: gemini
    channel: [text, voice, video]
