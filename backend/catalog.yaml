stt:
  # Entries are streaming unless they say `streaming: false`. A non-streaming
  # (batch) model is wrapped in LiveKit's stt.StreamAdapter, which uses the local
  # Silero VAD to cut utterances and then POSTs each one — so it trades the
  # transcription round-trip for price/accuracy, and it bills only the speech
  # the user actually produced rather than the whole call.
  - provider: xai
    channel: [voice, video]
    model: xai-stt          # synthetic id: xAI exposes one STT service in two modes
    label: "Grok STT (Streaming)"
    # xAI always auto-detects; `language` only switches on Inverse Text
    # Normalization (spoken numbers/currencies → written form) for that language.
    # Measured 2026-08-03: Hindi audio sent with language=en still came back as
    # correct Devanagari with language="hi" detected, and English audio sent with
    # language=hi still came back as English. So Auto is safe here even though a
    # code is always sent — which it must be, since the plugin hardcodes
    # format=true and the API 400s on "Field 'language' is required when 'format'
    # is true". `en` is the ITN default, not a transcription restriction.
    default_language: en
    languages: &xai_stt_languages
      - { code: ar, name: Arabic }
      - { code: cs, name: Czech }
      - { code: da, name: Danish }
      - { code: nl, name: Dutch }
      - { code: en, name: English }
      - { code: fil, name: Filipino }
      - { code: fr, name: French }
      - { code: de, name: German }
      - { code: hi, name: Hindi }
      - { code: id, name: Indonesian }
      - { code: it, name: Italian }
      - { code: ja, name: Japanese }
      - { code: ko, name: Korean }
      - { code: mk, name: Macedonian }
      - { code: ms, name: Malay }
      - { code: fa, name: Persian }
      - { code: pl, name: Polish }
      - { code: pt, name: Portuguese }
      - { code: ro, name: Romanian }
      - { code: ru, name: Russian }
      - { code: es, name: Spanish }
      - { code: sv, name: Swedish }
      - { code: th, name: Thai }
      - { code: tr, name: Turkish }
      - { code: vi, name: Vietnamese }
    pricing: { per_audio_second: 0.0000556 }   # $0.20/hr streaming
