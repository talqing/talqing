    reasoning_efforts: *gemini_reasoning_efforts
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    supports_prompt_cache_key: false
    builtin_tools: *gemini_builtin_tools
    pricing: { input_per_1m: 0.25, cached_input_per_1m: 0.025, output_per_1m: 1.50 }
    priority:
