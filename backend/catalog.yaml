    # AND 1.2, while Flash returns 116655 / 82382 / 67336 for the same three.
    # `speed` is simply not in v3's own request schema (`ElevenV3VoiceSettings`
    # carries stability and nothing else) — v3 expresses pace through audio tags
    # instead, which is what the `expressive` block below teaches. Offering the
    # slider anyway would be a control that does nothing.
    supports_speed: false
    voices: []
    # ElevenAPI Multilingual v2/v3: $0.10 / 1K chars. /v1/models reports
    # character_cost_multiplier=1.0.
    pricing: { per_character: 0.00010 }
    extra: {}
    # Per model, not per provider, and this entry is why: `eleven_v3` honours
    # these tags, while `eleven_turbo_v2_5` and `eleven_flash_v2_5` above speak
    # them out loud — measured 2026-08-15, `[laughs]` on Flash reaches the caller
    # as the word "Laughs".
    #
    # This dialect has no wrapping form at all: a tag colours roughly the next
    # four or five words and then delivery reverts, which is why the prompt below
    # is written differently from xAI's rather than being the same prose with the
    # labels swapped.
    #
    # Shared with `eleven_v3_conversational` below, which performs the same tags
    # identically (both measured 2026-09-22 by synthesizing "[laughs] That is
    # wonderful news. [whispers] Keep it between us." and reading the audio back
    # through speech-to-text: both returned the sentence with no tag words in it,
    # while eleven_flash_v2_5 returned "Laughs. That is wonderful news, whispers.").
    expressive: &eleven_v3_dialect
      prompt: |
        ## Speaking aloud

        Your words are spoken. Shape how they land with these tags, and nothing else:

        [laughs] [sighs] [whispers] [slow] [excited]

        Each colours roughly the next four or five words and then delivery returns to
        normal, so put one directly in front of the phrase it belongs to. Use one only
        where a real person's voice would; most replies need none.

        Example: That's all confirmed for Thursday the ninth. [slow] Your reference is
        A 7 X 9.
  # ElevenLabs' own recommendation for a conversational agent, and until now this
  # catalog carried a note saying we could not have it: the 2026-08 entry above
  # recorded a 401 model_access_denied on our workspace's tier. That is no longer
  # true — re-checked 2026-09-22, the model synthesizes on our key — so the note
  # is gone and the entry is here.
  #
  # It is v3's delivery at Flash's price: /v1/models reports
  # character_cost_multiplier 0.5, the same as Turbo and Flash and HALF eleven_v3
  # above, and ElevenLabs documents ~280ms against v3's studio latency. For a
  # voice agent that wants audio tags, this is the entry to reach for; eleven_v3
  # stays for anyone already on it.
  - provider: elevenlabs
    channel: [voice, video]
    model: eleven_v3_conversational
    label: "Eleven v3 Conversational"
    default_language:
    # Identical to eleven_v3's set — both report the same 74 language ids on
    # /v1/models, of which these are the ones this catalog publishes.
    languages: *eleven_v3_languages
    default_voice: hpp4J3VqNfWAUOO0d1Us
    supports_voice_settings: true   # see the Turbo entry above for what this covers
    # No speed control, exactly like eleven_v3 and for the same reason. MEASURED
    # 2026-09-22: the same sentence comes back as 5 seconds of audio at speed
    # 0.7, 1.2 AND 3.0 — and 3.0 is not even rejected, where eleven_flash_v2_5
    # refuses it ("expected to be greater or equal to 0.7") and does return
    # 6s / 3s for 0.7 / 1.2. The field is not read on this model, so offering the
    # slider would be a control that does nothing.
    supports_speed: false
    voices: []
    # $0.05 / 1K chars: character_cost_multiplier 0.5 against the 1-credit
    # Multilingual/v3 rate, same as Flash and Turbo.
    pricing: { per_character: 0.00005 }
    extra: {}
    expressive: *eleven_v3_dialect
  - provider: openai
    channel: [voice, video]
    model: gpt-4o-mini-tts
    label: "GPT-4o mini TTS"
    default_language:           # multilingual model; no language param at compile
    default_voice: alloy
    supports_speed: true
    speed_min: 0.5
    speed_max: 2.0
    # OpenAI exposes no list-voices API — the voice set is a fixed published enum,
    # declared here so the editor's picker can list them (no preview: OpenAI ships
    # no sample endpoint). Served via /catalog/voices?provider=openai&model=gpt-4o-mini-tts.
    voices:
      - { id: alloy, name: Alloy, gender: female }
      - { id: ash, name: Ash, gender: male }
      - { id: ballad, name: Ballad, gender: male }
      - { id: coral, name: Coral, gender: female }
      - { id: echo, name: Echo, gender: male }
      - { id: fable, name: Fable, gender: male }
      - { id: nova, name: Nova, gender: female }
      - { id: onyx, name: Onyx, gender: male }
      - { id: sage, name: Sage, gender: female }
      - { id: shimmer, name: Shimmer, gender: female }
      - { id: verse, name: Verse, gender: male }
      - { id: marin, name: Marin, gender: female }
      - { id: cedar, name: Cedar, gender: male }
    # gpt-4o-mini-tts bills text input tokens + audio output tokens.
    pricing: { input_per_1m: 0.60, output_per_1m: 12.00 }
    extra: {}
  - provider: openai
    channel: [voice, video]
    model: tts-1
    label: "TTS-1"
    default_language:
    default_voice: alloy
    supports_speed: true
    speed_min: 0.5
    speed_max: 2.0
    voices:
      - { id: alloy, name: Alloy, gender: female }
      - { id: ash, name: Ash, gender: male }
      - { id: coral, name: Coral, gender: female }
      - { id: echo, name: Echo, gender: male }
      - { id: fable, name: Fable, gender: male }
      - { id: nova, name: Nova, gender: female }
      - { id: onyx, name: Onyx, gender: male }
      - { id: sage, name: Sage, gender: female }
      - { id: shimmer, name: Shimmer, gender: female }
    pricing: { per_character: 0.000015 }        # $15 / 1M chars
    extra: {}
  - provider: openai
    channel: [voice, video]
    model: tts-1-hd
    label: "TTS-1 HD"
    default_language:
    default_voice: alloy
    supports_speed: true
    speed_min: 0.5
    speed_max: 2.0
    voices:
      - { id: alloy, name: Alloy, gender: female }
      - { id: ash, name: Ash, gender: male }
      - { id: coral, name: Coral, gender: female }
      - { id: echo, name: Echo, gender: male }
      - { id: fable, name: Fable, gender: male }
      - { id: nova, name: Nova, gender: female }
      - { id: onyx, name: Onyx, gender: male }
      - { id: sage, name: Sage, gender: female }
      - { id: shimmer, name: Shimmer, gender: female }
    pricing: { per_character: 0.00003 }         # $30 / 1M chars
    extra: {}
  # Deepgram's voice-agent-first text-to-speech, served on a different endpoint
  # from Aura (`/v2/speak`, not `/v1/speak`) and therefore a different LiveKit
  # class — `deepgram.TTSv2`, which compiler/factories.py builds for this entry
  # alone. VERIFIED 2026-09-22: synthesized a sentence through the plugin and
  # read the audio back through speech-to-text correctly, 1.4s to first byte.
  #
  # English only, and that is the trade against Aura-2 below: 36 voices across
  # American, British, Irish, Australian, Indian, Singaporean and Filipino
  # accents, and nothing else. An agent taking calls in any other language wants
  # Aura-2, which is also half the price.
  #
  # What the extra 1.5x buys is barge-in the pipeline does not have to
  # reconstruct: on an interruption the socket reports what the caller actually
  # heard. Talqing does not read that report yet — LiveKit's TTS interface has
  # nowhere to put it — so today this is a voice roster and a prosody model,
  # and the interruption handling is the same as every other TTS here.
  - provider: deepgram
    channel: [voice, video]
    model: flux          # logical/billing id; the actual voice is the Deepgram model string
    label: "Deepgram Flux TTS"
    # English only, so there is nothing to detect and nothing to pin: the voice
    # id carries the `-en` and the agent's language never reaches the plugin.
    default_language:
    default_voice: flux-alexis-en
    # Voices fetched live from Deepgram's v2 models API (GET /v2/models → the
    # `flux-tts` entries) via /catalog/voices?provider=deepgram. A separate call
    # from the Aura roster on purpose: /v1/models lists no Flux voice and
    # /v2/models lists no Aura one, so the two endpoints are two halves of the
    # same picker (services/catalog/voices/deepgram.py).
    voices: []
    pricing: { per_character: 0.000045 }         # $0.045 / 1k chars (Flux TTS PAYG)
    # Both are the plugin's own defaults, stated rather than inherited so a
    # change to either is made here beside the price.
    extra: { encoding: linear16, sample_rate: 24000 }
  - provider: deepgram
    channel: [voice, video]
    model: aura-2          # logical/billing id; the actual voice is the Deepgram model string
    label: "Deepgram Aura-2"
    default_language:           # language is encoded in the selected voice/model string
    default_voice: aura-2-thalia-en   # Aura encodes the voice in the model id (build_tts: voice→model)
    # Voices fetched live from Deepgram's models API (GET /v1/models → the aura-2
    # `tts` entries) via /catalog/voices?provider=deepgram — so the picker shows
    # accents, avatar images, and audio previews and stays current. Each voice id
    # IS the Deepgram model string passed at synth time; all bill at the same
    # per-character Aura-2 rate.
    voices: []
    pricing: { per_character: 0.00003 }          # $0.030 / 1k chars (Aura-2 PAYG)
    extra: {}
  - provider: deepgram
    channel: [voice, video]
    model: aura-1          # logical/billing id; the actual voice is the Deepgram model string
    label: "Deepgram Aura-1"
    default_language:
    default_voice: aura-asteria-en
    voices: []
    pricing: { per_character: 0.000015 }         # legacy Aura placeholder; verify plan-specific pricing.
    extra: {}

# ============================================================================
# Speech-to-speech models. One model replaces the whole stt/llm/tts cascade, so
# an agent picks EITHER a realtime entry OR the three cascade entries — never
# both. Voice and video alike: the Anam avatar renders from the audio the agent
# publishes, and a realtime model publishes audio exactly as a TTS does.
#
# Two limitations apply to every entry here and are documented for users in
# documentation/agents/realtime.mdx:
#   - No scripted speech. LiveKit's session.say() needs a TTS, so the greeting,
#     the `say` operation and the handoff line are delivered as "say this word
#     for word" instructions the model may reword (compiler/speech.py).
#   - No on_user_turn_completed. The model detects turns server-side, so LiveKit
#     never runs that hook — agent validation rejects the combination.
# ============================================================================
realtime:
  - provider: openai
    channel: [voice, video]
    model: gpt-realtime-2.1
    label: "GPT Realtime 2.1 (OpenAI)"
    vision: true
    default_language:           # empty => the transcription model auto-detects
    languages: *openai_stt_languages
    default_voice: marin        # OpenAI recommends marin/cedar for best quality
    supports_speed: true
    speed_min: 0.5
    speed_max: 2.0
    # OpenAI ships no list-voices API; this is the published realtime enum
    # (a subset of the TTS roster — fable/nova/onyx are not realtime voices).
    voices: &openai_realtime_voices
      - { id: alloy, name: Alloy, gender: female }
      - { id: ash, name: Ash, gender: male }
      - { id: ballad, name: Ballad, gender: male }
      - { id: coral, name: Coral, gender: female }
      - { id: echo, name: Echo, gender: male }
      - { id: sage, name: Sage, gender: female }
      - { id: shimmer, name: Shimmer, gender: female }
      - { id: verse, name: Verse, gender: male }
      - { id: marin, name: Marin, gender: female }
      - { id: cedar, name: Cedar, gender: male }
    # Standard tier at short context; long context bills at 2x. Audio input is
    # 8x text input and audio output 2.7x text output — the modality split is
    # why realtime needs its own pricing block.
    pricing:
      text_input_per_1m: 4.00
      cached_text_input_per_1m: 0.40
      audio_input_per_1m: 32.00
      cached_audio_input_per_1m: 0.40
      text_output_per_1m: 24.00
      audio_output_per_1m: 64.00
    # OpenAI emits no user transcript unless a transcription model is named, and
    # Talqing stores every conversation item — so this is not optional. The
    # cheapest one OpenAI's realtime session accepts ($0.003/min); OpenAI bills
    # it separately from the audio tokens above and LiveKit reports no quantity
    # for it, so that cost is passthrough we cannot meter (documented).
    extra: { transcription_model: gpt-4o-mini-transcribe }
  - provider: openai
    channel: [voice, video]
    model: gpt-realtime-2.1-mini
    label: "GPT Realtime 2.1 mini (OpenAI)"
    vision: true
    default_language:
    languages: *openai_stt_languages
    default_voice: marin
    supports_speed: true
    speed_min: 0.5
    speed_max: 2.0
    voices: *openai_realtime_voices
    pricing:
      text_input_per_1m: 0.60
      cached_text_input_per_1m: 0.06
      audio_input_per_1m: 10.00
      cached_audio_input_per_1m: 0.30
      text_output_per_1m: 2.40
      audio_output_per_1m: 20.00
    extra: { transcription_model: gpt-4o-mini-transcribe }
  # OpenAI's GPT-Live, which is NOT a realtime model with a new name: it is a
  # separate service on `/v1/live/sessions` (the model page marks `v1/realtime`
  # "Not supported"), spoken by its own plugin class, `openai.realtime.
  # GPTLiveModel`. `api: live` is what tells compiler/factories.py to build that
  # class instead of the realtime one.
  #
  # It is full duplex — it listens and speaks at once — and it is billed by the
  # SECOND of session, $0.05/min flat, with no audio-token rate at all. On the
  # 45-second call the estimator models, that is a different shape of bill from
  # gpt-realtime-2.1 above rather than simply a cheaper one: nothing the caller
  # says or the model says changes it.
  #
  # TWO THINGS TO KNOW BEFORE PUTTING AN AGENT ON IT.
  #
  # 1. It cannot be handed off from. The model refuses new instructions once its
  #    session is open ("gpt-live voice instructions are immutable after session
  #    start"), and a handoff is exactly that — `AgentSession.update_agent`
  #    hands the target's prompt to the live session. `supports_instruction_update:
  #    false` is what that costs, and agent validation refuses to publish an
  #    agent that has both this model and a handoff destination, rather than
  #    letting the call raise mid-conversation.
  #
  # 2. Its reasoning and its tools run on a SECOND model. GPT-Live delegates
  #    both to a backend Responses model, billed separately at that model's own
  #    per-token rates — so the real cost of a call is $0.05/min plus whatever
  #    `backend_model` below spends. LiveKit reports that spend under the backend
  #    model's own name, so it prices off that model's `llm:` entry above and
  #    nothing here has to restate its rates. `gpt-5.6-luna` is OpenAI's own
  #    default for the slot; it is a catalog
  #    decision for the same reason `transcription_model` is one on the two
  #    entries above — which model runs is a pricing decision, and the agent
  #    editor has no control for it.
  - provider: openai
    channel: [voice, video]
    api: live
    model: gpt-live-1
    label: "GPT-Live 1 (OpenAI)"
    # OpenAI's model page lists image and video under "Unsupported modalities",
    # and unlike every other entry here this is the vendor's word rather than our
    # probe. `false` is the safe direction either way: the attach control stays
    # hidden, which is what an unprobed model should get.
    vision: false
    # See above: a handoff would raise on this model mid-call.
    supports_instruction_update: false
    # The plugin exposes no language knob and no speed knob; steer the language
    # from the agent prompt, as on the grok-voice entries below.
    default_language:
    default_voice: marin
    supports_speed: false
    # GPT-Live's own six, which are NOT the realtime roster above: no alloy, ash,
    # coral, echo, sage, shimmer or verse, and five names that appear nowhere
    # else in this file.
    voices:
      - { id: aster, name: Aster }
      - { id: beacon, name: Beacon }
      - { id: cinder, name: Cinder }
      - { id: marin, name: Marin }
      - { id: stone, name: Stone }
      - { id: vesper, name: Vesper }
    # Billed per second of session and by nothing else. The zero token rates are
    # real rather than missing, for the same reason as the grok-voice entries
    # below: LiveKit reports this model's usage with every token count at 0, and
    # an unset rate would quarantine the session the moment one arrived.
    pricing:
      per_session_minute: 0.05
      text_input_per_1m: 0.00
      cached_text_input_per_1m: 0.00
      audio_input_per_1m: 0.00
      cached_audio_input_per_1m: 0.00
      text_output_per_1m: 0.00
      audio_output_per_1m: 0.00
    # No `transcription_model`: unlike the realtime entries above, GPT-Live
    # transcribes both sides itself and needs nothing named.
    extra: { backend_model: gpt-5.6-luna }
  # Google's current Live model, and the first one since gemini-2.5 that our
  # pipeline can actually use — see the note on gemini-3.1-flash-live-preview
  # below for what broke there. PROBED 2026-09-22 against exactly that failure:
  # two consecutive `send_client_content` turns both produced audio (11 and 13
  # chunks), which is the greeting-then-handoff shape 3.1 could not do.
  #
  # Also probed: the same 30 prebuilt voices answer (spot-checked Puck, Zephyr,
  # Sulafat and Charon), a pinned `language_code` is accepted, and the model read
  # "4731" off an image sent on the live socket.
  #
  # `gemini-3.8-live-extended-thinking` is deliberately absent: it refuses a
  # session that does not name a thinking level ("Thinking level must be
  # specified for this model", measured) and the LiveKit plugin sends none. It is
  # the wrong trade for a voice call in any case — thinking is silence.
  - provider: gemini
    channel: [voice, video]
    model: gemini-3.8-live
    label: "Gemini 3.8 Live (Google)"
    vision: true
    # Native-audio Gemini code-switches on its own; a pinned language_code only
    # helps when the caller's language is known up front.
    default_language:
    languages: *broad_stt_languages
    default_voice: Puck
    # The Live API has no speed control; prosody comes from the model.
    supports_speed: false
    voices: &gemini_live_voices
      - { id: Zephyr, name: Zephyr, description: Bright }
      - { id: Puck, name: Puck, description: Upbeat }
      - { id: Charon, name: Charon, description: Informative }
      - { id: Kore, name: Kore, description: Firm }
      - { id: Fenrir, name: Fenrir, description: Excitable }
      - { id: Leda, name: Leda, description: Youthful }
      - { id: Orus, name: Orus, description: Firm }
      - { id: Aoede, name: Aoede, description: Breezy }
      - { id: Callirrhoe, name: Callirrhoe, description: Easy-going }
      - { id: Autonoe, name: Autonoe, description: Bright }
      - { id: Enceladus, name: Enceladus, description: Breathy }
      - { id: Iapetus, name: Iapetus, description: Clear }
      - { id: Umbriel, name: Umbriel, description: Easy-going }
      - { id: Algieba, name: Algieba, description: Smooth }
      - { id: Despina, name: Despina, description: Smooth }
      - { id: Erinome, name: Erinome, description: Clear }
      - { id: Algenib, name: Algenib, description: Gravelly }
      - { id: Rasalgethi, name: Rasalgethi, description: Informative }
      - { id: Laomedeia, name: Laomedeia, description: Upbeat }
      - { id: Achernar, name: Achernar, description: Soft }
      - { id: Alnilam, name: Alnilam, description: Firm }
      - { id: Schedar, name: Schedar, description: Even }
      - { id: Gacrux, name: Gacrux, description: Mature }
      - { id: Pulcherrima, name: Pulcherrima, description: Forward }
      - { id: Achird, name: Achird, description: Friendly }
      - { id: Zubenelgenubi, name: Zubenelgenubi, description: Casual }
      - { id: Vindemiatrix, name: Vindemiatrix, description: Gentle }
      - { id: Sadachbia, name: Sadachbia, description: Lively }
      - { id: Sadaltager, name: Sadaltager, description: Knowledgeable }
      - { id: Sulafat, name: Sulafat, description: Warm }
    # Paid tier. Google publishes the audio rates both per-token and per-minute
    # ($3.00/1M ↔ $0.005/min in, $12.00/1M ↔ $0.018/min out — unchanged from the
    # 2.5 entry below); the text rates are this model's own and are higher.
    # There is no cached tier on the Live API, so the cached rates stay unset.
    pricing:
      text_input_per_1m: 0.75
      audio_input_per_1m: 3.00
      text_output_per_1m: 4.50
      audio_output_per_1m: 12.00
    # Gemini transcribes both directions inside the Live session at no extra
    # charge, so there is no separate transcription model to name.
    extra: {}
  # gemini-3.1-flash-live-preview is deliberately absent. It rejects
  # send_client_content after the first model turn, which breaks generate_reply,
  # update_instructions and update_chat_ctx — i.e. both the greeting (delivered
  # via generate_reply on this pipeline) and every handoff. Revisit when Google
  # lifts the restriction.
  - provider: gemini
    channel: [voice, video]
    model: gemini-2.5-flash-native-audio-preview-12-2025
    label: "Gemini 2.5 Flash Native Audio (Live)"
    # Reads an image sent on the live socket. The model rejects the TEXT
    # modality outright, which is irrelevant here — the runtime uses audio.
    vision: true
    # Native-audio Gemini code-switches on its own; a pinned language_code only
    # helps when the caller's language is known up front.
    default_language:
    languages: *broad_stt_languages
    default_voice: Puck
    # The Live API has no speed control; prosody comes from the model.
    supports_speed: false
    voices: *gemini_live_voices
    # Paid tier. Gemini publishes the same audio rates per-token and per-minute
    # ($3.00/1M ↔ $0.005/min in, $12.00/1M ↔ $0.018/min out); the token form is
    # metered because that is what LiveKit reports. There is no cached tier on
    # the Live API, so the cached rates stay unset — no realtime cached tokens
    # are reported for this model, and pricing raises if any ever appear.
    pricing:
      text_input_per_1m: 0.50
      audio_input_per_1m: 3.00
      text_output_per_1m: 2.00
      audio_output_per_1m: 12.00
    # Gemini transcribes both directions inside the Live session at no extra
    # charge, so unlike OpenAI there is no separate transcription model to name.
    extra: {}
  - provider: xai
    channel: [voice, video]
    model: grok-voice-think-fast-2.0
    label: "Grok Voice Think Fast 2.0 (xAI)"
    # NOT a missing probe. xAI's realtime API accepts an image without any
    # error, echoes the item back with the image part removed, and then
    # answers confidently about a photo it never saw — for a red circle
    # marked 47 it said "blue, circle, 8". A wrong answer with no signal is
    # worse than an error, and is why this is a flag rather than optimism.
    # xAI's non-realtime models (grok-4.5, grok-4.3) read images perfectly.
    vision: false
    # The plugin exposes no language or speed knob for Grok Voice; steer the
    # language from the agent prompt instead.
    default_language:
    default_voice: ara
    supports_speed: false
    # Voices fetched live from xAI (GET /catalog/voices?provider=xai) — the
    # speech-to-speech roster is the same one the xAI TTS entry uses.
    voices: []
    # xAI bills speech-to-speech by the MINUTE of audio, not by token, so the
    # token rates are a real 0.00 rather than a missing rate — leaving them
    # unset would quarantine every session the moment xAI reports a token count.
    # $0.08/min ($4.80/hr), docs.x.ai/developers/pricing, checked 2026-08-02.
    #
    # Not metered: xAI also charges $0.004 per client `conversation.item.create`
    # text event (tool results and audio items excluded). LiveKit does not count
    # those events, and a handful per call is worth a couple of cents — inventing
    # a proxy quantity would report a number we cannot stand behind.
    pricing: &xai_realtime_zero_token_rates
      per_session_minute: 0.08
      text_input_per_1m: 0.00
      cached_text_input_per_1m: 0.00
      audio_input_per_1m: 0.00
      cached_audio_input_per_1m: 0.00
      text_output_per_1m: 0.00
      audio_output_per_1m: 0.00
    extra: {}
  - provider: xai
    channel: [voice, video]
    model: grok-voice-think-fast-1.0
    label: "Grok Voice Think Fast 1.0 (xAI)"
    # NOT a missing probe. xAI's realtime API accepts an image without any
    # error, echoes the item back with the image part removed, and then
    # answers confidently about a photo it never saw — for a red circle
    # marked 47 it said "blue, circle, 8". A wrong answer with no signal is
    # worse than an error, and is why this is a flag rather than optimism.
    # xAI's non-realtime models (grok-4.5, grok-4.3) read images perfectly.
    vision: false
    default_language:
    default_voice: ara
    supports_speed: false
    voices: []
    pricing:
      <<: *xai_realtime_zero_token_rates
      per_session_minute: 0.05         # $3.00/hr
    extra: {}

# Anam.ai avatar rendering layer. Pricing is per provider
# (not per Cara generation): one catalog SKU anam/anam. Cara versions
# (cara-3 / cara-4 / …) and render styles are live gallery filters from
# GET /catalog/avatars (Anam activeVersion / renderStyle) — not billable models.
# avatar_usage writes the catalog model (anam). Runtime does not pass
# avatarModel to Anam (server default = the face's activeVersion).
# Wall-clock seconds (idle included) are priced per minute, separately from
# whatever produces the agent's audio.
avatar:
  - provider: anam
    channel: [video]
    model: anam
    label: "Anam"
    pricing: { per_minute: 0.16 }
    extra: {}

# Speech enhancement on the CALLER's inbound audio, applied before the speech-to-
# text model and the VAD ever see it — so a cleaner signal reaches both, and the
# recording captures what the agent actually heard. Off unless an agent asks for
# it. No pricing block on purpose: this is BYOK, so ai-coustics bills the tenant
# directly and nothing here reaches metering or the $/min estimate. Krisp is not
# offered.
#
# ORDER MATTERS: the editor falls back to the first entry when an agent names a
# model the catalog no longer has, so the cheapest model leads.
#
# Every `description` must be traceable to ai-coustics' own docs — "less accurate"
# and "reach for it only if S leaves noise behind" were both ours, and both put
# words in the vendor's mouth.
#
# `EnhancerModel` is opaque about the model file behind it. The bundled core
# resolves VF_S -> quail-vf-2.1-s-16khz, VF_L -> quail-vf-2.1-l-16khz, QUAIL_L ->
# quail-l-16khz — all current, none deprecated (checked 2026-08-19).
noise_cancellation:
  - provider: aicoustics
    channel: [voice, video]
    model: quail_vf_s
    label: "Quail Voice Focus S"
    description: "Isolates the one person talking to the agent, suppressing other voices, echo and background noise."
    extra: {}
  - provider: aicoustics
    channel: [voice, video]
    model: quail_vf_l
    label: "Quail Voice Focus L"
    description: "The larger Voice Focus model — same job, significantly more CPU, no documented accuracy gain."
    extra: {}
  - provider: aicoustics
    channel: [voice, video]
    model: quail_l
    label: "Quail L"
    description: "Keeps every voice and removes only noise — a speakerphone, a room, a distant speaker."
    extra: {}

# The CoPilots' model. `reasoning_effort` is high because they edit the
# tenant's configuration and are worth thinking time, and nobody is waiting on a
# voice turn.
#
# Do NOT give this model a `temperature` in its llm entry above, the way grok-4.3
# has one: the luna models accept temperature at effort "none" but 400 on it at
# any thinking effort ("Only the default (1) value is supported", probed
# 2026-08-07 on gpt-5.6-luna), and this
# block asks for "high" — so a catalog temperature would fail every CoPilot turn
# while leaving ordinary agents on the same model working.
#
# Back on gpt-5.6-luna since 2026-10-01, after a week on gpt-6-luna: that model
# left the catalog (see the note beside gpt-6-sol), and the CoPilot runs on a
# catalog entry like any agent.
copilot: { provider: openai, model: gpt-5.6-luna, reasoning_effort: high }

# The platform fee. Under BYOK this is the only money Talqing earns from a run —
# the provider cost beside it is the tenant's own spend on their own key.
#
# A call is billed by the minute. A chat is billed per answered message: it has
# no length worth measuring, since it stays open until somebody ends it.
platform_fee_per_minute:
  voice: 0.0035   # ₹0.35/min
  video: 0.01     # ₹1/min
platform_fee_per_message:
  text: 0.0001

# The rate the landing page's ₹ figures are derived from. The platform bills in
# USD; this exists so the ₹ we advertise and the $ we charge cannot drift apart.
# NOT a live FX rate, and never what a buyer is charged — Dodo converts at the
# real rate at checkout, which is why nothing post-login quotes ₹.
inr_per_usd: 100

# There is deliberately no post-call analysis section here. No default model:
# analysis runs on the agent's own LLM unless the agent names another, so it
# never demands a provider key the agent did not already need. And no $/min
# figure: analysis bills the real tokens of one call made after the call ends,
# which is not a per-minute rate and so has nothing to contribute to the
# editor's estimate.

# Usage assumptions for the dashboard's client-side $/min estimator. Provider
# prices still come from the catalog entries above; these quantities turn
# token/character-priced services into an approximate per-minute display.
cost_estimate_usage_per_minute:
  llm_input_tokens: 800
  llm_cached_input_tokens: 0
  llm_output_tokens: 250
  tts_characters: 900
  tts_input_tokens: 225
  tts_output_tokens: 1500
  # A streaming STT bills the open socket, so it charges all 60 seconds. A batch
  # STT only ever sees the utterances the StreamAdapter submits, so it bills the
  # caller's share of the conversation — assume the caller speaks a third of it.
  stt_streaming_audio_seconds: 60
  stt_batch_audio_seconds: 20
  # Speech-to-speech audio-token rates per minute. Gemini is the only vendor
  # publishing the same audio stream both per-token and per-minute, so its two
  # forms give the conversion: $3.00/1M ↔ $0.005/min ⇒ ~1667 tokens per minute
  # of audio in, $12.00/1M ↔ $0.018/min ⇒ ~1500 per minute of audio out. The
  # model hears the whole minute but speaks under half of it, so input takes the
  # full 1667 and output about 45% of 1500. Text covers the prompt and tool
  # traffic; there is no cached tier on any realtime model offered today.
  realtime_audio_input_tokens: 1667
  realtime_cached_audio_input_tokens: 0
  realtime_text_input_tokens: 800
  realtime_audio_output_tokens: 675
  realtime_text_output_tokens: 250
  # Screen share, when the agent watches one: the single newest frame is added
  # to every user turn and to nothing else. Measured, not assumed — a 1280px
  # frame at LiveKit's JPEG quality is 1118 input tokens — times the ~2.5 user
  # turns a spoken minute holds. Entirely uncached: the frame is in the request
  # tail every turn and never in stored history, which is what keeps a
  # sixty-minute call costing the same per turn as the first one.
  screenshare_input_tokens: 2795

# The same, for a text agent: what one answered message costs. A chat has no
# minutes, so the editor quotes it per message.
cost_estimate_usage_per_text_message:
  llm_input_tokens: 800
  llm_cached_input_tokens: 0
  llm_output_tokens: 250
