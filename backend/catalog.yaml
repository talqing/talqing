      - { code: fr, name: French }
      - { code: de, name: German }
      - { code: hi, name: Hindi }
      - { code: id, name: Indonesian }
      - { code: it, name: Italian }
      - { code: ja, name: Japanese }
      - { code: ko, name: Korean }
      - { code: pt-BR, name: "Portuguese (Brazil)" }
      - { code: pt-PT, name: "Portuguese (Portugal)" }
      - { code: ru, name: Russian }
      - { code: es-MX, name: "Spanish (Mexico)" }
      - { code: es-ES, name: "Spanish (Spain)" }
      - { code: tr, name: Turkish }
      - { code: vi, name: Vietnamese }
    default_voice: ara       # the editor's picker fetches the full list live
    supports_speed: true
    speed_min: 0.7
    speed_max: 1.5
    # voices fetched live from xAI (GET /v1/tts/voices via /catalog/voices?provider=xai)
    pricing: { per_character: 0.000015 }         # $15 / 1M chars
    extra: {}
    # Delivery markup, taught to the LLM verbatim — xAI's own syntax, never an
    # intermediate form of ours, because these are the tags the model already
    # knows from training data and nothing has to be lowered on the way out.
    # Nothing else in the pipeline touches them: the provider honours what it
    # knows and silently drops what it does not, so there is no strip anywhere
    # and a hallucinated label costs nothing (measured 2026-08-15).
    #
    # The vocabulary lives in the prompt and nowhere else — it is only ever used
    # to tell the model what it may write. The labels are transcribed from the
    # "Speech Tags" tables at
    # docs.x.ai/developers/model-capabilities/audio/text-to-speech, in the order
    # of the doc's own categories (pauses / laughter & crying / mouth sounds /
    # breathing, then volume & intensity / pitch & speed / vocal style).
    expressive:
      prompt: |
        ## Speaking aloud

        Your words are spoken. Shape how they land with these tags, and nothing else — no
        markdown, no emoji, no stage directions written out as words.

        At a point in the line: [pause] [long-pause] [laugh] [chuckle] [giggle] [cry]
        [sigh] [breath] [inhale] [exhale] [tsk] [tongue-click] [lip-smack] [hum-tune]

        Around a phrase, always closed: <emphasis> <whisper> <soft> <loud>
        <build-intensity> <decrease-intensity> <higher-pitch> <lower-pitch> <slow> <fast>
        <sing-song> <singing> <laugh-speak>

        Use one only where a real person's voice would do that thing. Most replies need
        none, and one deliberate tag carries further than three in a row. Never place a
        pause beside sentence punctuation, never emphasise more than a single word, and
        keep laughter for something genuinely funny. Match the register of the moment: bad
        news stays composed however casual the call has been.

        Example: I have you down for [pause] Thursday the <emphasis>ninth</emphasis>.
        <slow>Your reference is A 7 X 9.</slow>
  - provider: sarvam
    channel: [voice, video]
    model: bulbul:v3
    label: "Sarvam Bulbul v3 (Indian)"
