# ============================================================================
# talqing provider catalog. Drives editor dropdowns, the cost estimator,
# and metering prices. Adding a model = editing this file (+ a factory if a new
# provider). Pricing units: LLM per-1M tokens; STT per audio second;
# TTS per character. ALL PRICES IN USD (Sarvam converted from INR at 1 USD =
# 100 INR). All entries compile to REAL plugin instances (never model strings
# → never the LiveKit Cloud inference gateway).
# ============================================================================

providers:
  xai:
    label: xAI
    logo_url: https://x.ai/favicon.ico
    enabled: true
  openai:
    label: OpenAI
    logo_url: https://auth-cdn.oaistatic.com/assets/favicon-hQZ_bs-n.svg
    enabled: true
  gemini:
    label: Gemini
    logo_url: https://gemini.google/images/spark_4c.png
    enabled: true
  sarvam:
    label: Sarvam
    logo_url: https://dashboard.sarvam.ai/icon.svg?icon.088160iueq3g1.svg
    enabled: true
  raya:
    label: Raya
    logo_url: https://getraya.app/favicon.ico
    enabled: true
  soniox:
    label: Soniox
    logo_url: https://soniox.com/favicon.ico
    enabled: true
  elevenlabs:
    label: ElevenLabs
    logo_url: https://elevenlabs.io/favicon.ico
    enabled: true
  deepgram:
    label: Deepgram
    logo_url: https://deepgram.com/favicon.ico
    enabled: true
  anam:
    label: Anam
    logo_url: https://framerusercontent.com/images/gkFtw8nRt1oMSA2A8R4PiZTFUg.png
    enabled: true
  aicoustics:
    label: ai-coustics
    logo_url: https://framerusercontent.com/images/wzHDeVOUnA3g6kGKRrz0akwe6ww.png
    enabled: true
  # The one provider whose models are NOT in this file. One key reaches ~260
  # tool-capable language models and ~20 speech-to-text ones, the lists move
  # weekly, and shipping them here would add ~20k tokens to `GET /catalog` —
  # which the CoPilot loads on every model call. They come from a live registry
  # instead (`services/catalog/openrouter.py`) and the editor searches it;
  # everything else about them behaves like any other entry.
  #
  # `models:` is what makes that work on a voice call, one block per kind the
  # registry serves. A voice job process holds no registry, so every field the
  # runtime reads to BUILD the client is declared once here rather than per
  # model — the only per-model read left is the LLM thinking effort, which
  # publishing freezes onto the config.
  #
  # No `temperature` in `extra`, unlike the xAI entries: it is not universal
  # here. `anthropic/claude-sonnet-5` does not list it in `supported_parameters`
  # at all, and one value cannot be right for 260 models from 30 vendors.
  openrouter:
    label: OpenRouter
    logo_url: https://openrouter.ai/apple-touch-icon.png
    enabled: true
    browse: search
    models:
      llm:
        api: chat_completions
        base_url: https://openrouter.ai/api/v1
        supports_prompt_cache_key: true   # accepted, and doubles as the sticky-routing key
        extra: {}
      stt:
        base_url: https://openrouter.ai/api/v1
        # Every OpenRouter transcription model is request/response — the gateway
        # has no streaming transcription surface at all (`/api/v1/realtime`
        # 404s). Declared here because the voice job decides turn detection from
        # it before any client exists, and holds no registry to ask.
        streaming: false
        extra: {}

# `api` picks the LiveKit client class build_llm constructs. `chat_completions`
# and `responses` are both the OpenAI plugin pointed at the provider's own
# `base_url`, and only the second can carry `builtin_tools` — the tools the
# provider runs on its own servers mid-turn. `native` is the provider's own
# plugin, taken only when the compatibility endpoint cannot express something
# worth having: Gemini serves no /responses at all, so its server-side tools are
# reachable nowhere else.
#
# `reasoning_efforts` is the thinking knob the agent editor offers: every value
# THIS model was measured to accept, declared fastest first. The first one is
# also the default every agent on the model gets until its author picks another,
# which is why the order is validated rather than trusted — the fastest setting
# is the only safe default when a voice caller hears thinking as silence.
# These lists are probed, never read off a provider's docs; they disagree with
# those docs on several models (see the notes per family). No `reasoning_efforts`
# at all = no such knob: nothing goes on the wire and the editor shows no control.
#
# `builtin_tools[].options[].path` is where a value goes inside the tool object,
# which is not the same as its `key`: xAI and OpenAI both nest domain filters
# under `filters`, while xAI's image switches are top-level. On a `native` entry
# the tool is a typed object rather than JSON, so `path` is the single field name
# on it. The editor renders whatever is declared here from `type`, so a new
# provider is a catalog edit.
#
# Deliberately NOT declared: `image_generation` (LiveKit only logs server-side
# tool output, so the image would be billed and dropped — there is no surface for
# it yet) and `mcp` (Talqing attaches MCP servers itself through
# compiler/integrations.py, where we control the tool list and see every call).
llm:
  # `vision: true` means this exact model was PROBED reading an image — a 640x480
  # picture with a number in it, sent as `input_image` + a data URL through
  # /responses or `inline_data` through generateContent, exactly as the runtime
  # sends one. Every entry below passed. False is the default in `LLMEntry`, so a
  # model added without a probe cannot silently claim to see, and there is a
  # realtime model that would have.
  - provider: xai
    channel: [text, voice, video]
    model: grok-4.3
    label: "Grok 4.3 (xAI)"
    vision: true
    api: responses
    # Every value accepted (probed 2026-08-07). Note "minimal" is not the floor
    # it sounds like on xAI — it burned MORE thinking tokens than "low" on a
    # trivial prompt — so "none" remains the only setting that truly stops it.
    reasoning_efforts: [none, minimal, low, medium, high]
    base_url: https://eu-west-1.api.x.ai/v1     # EU LLM region; STT/TTS stay on api.x.ai via plugin defaults
    pricing: { input_per_1m: 1.25, cached_input_per_1m: 0.20, output_per_1m: 2.50 }
    priority:
      pricing: { input_per_1m: 2.50, cached_input_per_1m: 0.40, output_per_1m: 5.00 }
    # lowered from the provider default (~1.0): action agents must follow
    # tool-calling instructions, not pattern-complete their own prior
    # confirmations (hallucinated-tool-call mitigation); 0.5 keeps
    # conversational variety
    extra: { temperature: 0.5 }
    # Anchored on the first xAI entry so grok-4.5 and grok-4.6 share one
    # definition — every xAI text model offers the same server-side tools.
    builtin_tools: &xai_builtin_tools
      - type: web_search
        label: "Web search"
        description: >-
          Searches the live web and reads pages before answering, so the agent
          can talk about things that happened after the model was trained.
        price_note: "Billed by xAI at $5.00 per 1,000 searches, on top of tokens. Talqing's cost estimate does not include it."
        options:
          # xAI rejects a request that carries both, so they are declared as a
          # conflicting pair rather than left to 400 on a live call.
          - key: allowed_domains
            path: [filters, allowed_domains]
            label: "Allowed domains"
            type: string_list
            max_items: 5
            conflicts_with: [excluded_domains]
            description: "Up to 5 domains, without the https:// prefix."
          - key: excluded_domains
            path: [filters, excluded_domains]
            label: "Excluded domains"
            type: string_list
            max_items: 5
            conflicts_with: [allowed_domains]
            description: "Up to 5 domains, without the https:// prefix."
          - key: enable_image_understanding
            path: [enable_image_understanding]
            label: "Enable image understanding"
            type: boolean
            description: "Costs image tokens, not a tool call. Also applies to X search when both are on."
          - key: enable_image_search
            path: [enable_image_search]
            label: "Enable image search"
            type: boolean
            description: "Returns images as markdown embeds in the reply. Billed at the web search rate."
      - type: x_search
        label: "X search"
        description: "Searches posts, profiles and threads on X."
        price_note: "Billed by xAI at $5.00 per 1,000 searches, on top of tokens. Talqing's cost estimate does not include it."
        options:
          - key: allowed_x_handles
            path: [allowed_x_handles]
            label: "Allowed X handles"
            type: string_list
            max_items: 20
            conflicts_with: [excluded_x_handles]
            description: "Up to 20 handles, without the @."
          - key: excluded_x_handles
            path: [excluded_x_handles]
            label: "Excluded X handles"
            type: string_list
            max_items: 20
            conflicts_with: [allowed_x_handles]
            description: "Up to 20 handles, without the @."
          - key: from_date
            path: [from_date]
            label: "From date"
            type: string
            description: "ISO 8601 date, e.g. 2026-01-31."
          - key: to_date
            path: [to_date]
            label: "To date"
            type: string
            description: "ISO 8601 date, e.g. 2026-01-31."
          - key: enable_image_understanding
            path: [enable_image_understanding]
            label: "Enable image understanding"
            type: boolean
          - key: enable_video_understanding
            path: [enable_video_understanding]
            label: "Enable video understanding"
            type: boolean
      - type: code_interpreter
        label: "Code interpreter"
        description: >-
          Writes and runs Python in a sandbox to work something out — arithmetic,
          dates, parsing — instead of guessing at it. No network, no filesystem,
          nothing kept between requests.
        price_note: "Billed by xAI at $5.00 per 1,000 runs, on top of tokens. Talqing's cost estimate does not include it."
        # xAI's code interpreter takes no configuration at all — unlike OpenAI's,
        # which requires a container. Same tool name, different object.
      - type: file_search
        label: "Collections search"
        description: >-
          Searches documents you have uploaded to xAI as a collection. The
          collection lives in your xAI account, and you create and fill it at
          console.x.ai.
        price_note: "Billed by xAI at $2.50 per 1,000 searches, plus xAI's collection storage. Talqing's cost estimate does not include it."
        options:
          - key: vector_store_ids
            path: [vector_store_ids]
            label: "Vector store IDs"
            type: string_list
            required: true
            description: "From console.x.ai, e.g. collection_3be0eec8-…"
          - key: max_num_results
            path: [max_num_results]
            label: "Max num results"
            type: integer
  # Offered on voice and video with a caveat the author should know: grok-4.5
  # cannot stop reasoning. `reasoning_effort: none` 400s ("This model does not
  # support ..."), and even the floor spends thinking tokens on a trivial prompt
  # (69 of them on "what is 17*24" at `low`, probed 2026-08-01). Every spoken turn
  # pays that as silence before the first word, unlike grok-4.3 above, which takes
  # `none`. Kept available because the latency/quality trade is the agent author's
  # call, not ours — but grok-4.3 is the safer default for a voice pipeline.
  - provider: xai
    channel: [text, voice, video]
    model: grok-4.5
    label: "Grok 4.5 (xAI)"
    vision: true
    api: responses
    # No "none": this model rejects it outright (400). "minimal" IS accepted
    # (probed 2026-08-07), which the 2026-08-01 note above missed when it called
    # `low` the floor — so the default drops from `low` to `minimal` here.
    reasoning_efforts: [minimal, low, medium, high]
    # Global endpoint, not grok-4.3's eu-west-1 host: grok-4.5 is served from
    # us-east-1 / us-west-2 only, so an EU-pinned base_url would 404.
    base_url: https://api.x.ai/v1
    # Standard tier, prompts <200k tokens; xAI bills the whole request at 2x
    # ($4.00/$0.60/$12.00) once a prompt reaches 200k.
    pricing: { input_per_1m: 2.00, cached_input_per_1m: 0.30, output_per_1m: 6.00 }
    # The provider's low-latency lane, requested as `service_tier: priority`.
    # Declared per model because support and premium both are: OpenAI charges 2x
    # on its 5.6 family, 2.5x on gpt-5.5, 1.75x on gpt-4.1 and offers no lane at
    # all on gpt-5.4-nano, so these are transcribed from each vendor's price list
    # rather than derived from a multiplier. Omit the block and the model has no
    # lane — agents cannot ask for one and the editor shows no control.
    #
    # xAI is a flat 2x, and bills it only when the response confirms
    # `service_tier: priority` (docs.x.ai/developers/pricing). Measured
    # 2026-08-08: priority moved grok-4.5's median TTFT 1.565s -> 1.506s, i.e.
    # nothing worth the premium today. Offered anyway because capacity varies and
    # the choice is the agent author's to make, not ours.
    priority:
      pricing: { input_per_1m: 4.00, cached_input_per_1m: 0.60, output_per_1m: 12.00 }
    # temperature: same hallucinated-tool-call mitigation as grok-4.3 above.
    extra: { temperature: 0.5 }
    builtin_tools: *xai_builtin_tools
  # Same shape as grok-4.5 above — same API, same global endpoint, same
  # temperature mitigation, same server-side tools — with grok-4.6's own price
  # list (docs.x.ai/developers/models/grok-4.6: cached input is $0.50 here, not
  # grok-4.5's $0.30) and its 500k context.
  #
  # Both claims below were PROBED against the live API 2026-09-08, not inherited
  # from grok-4.5: `none` is rejected ("This model does not support
  # `reasoning_effort` value `none`") while minimal/low/medium/high are accepted
  # and spend 66/80/85/137 thinking tokens on "what is 17*24"; and the model read
  # a 640x480 image with "4731" in it correctly, which is what `vision: true`
  # asserts here.
  - provider: xai
    channel: [text, voice, video]
    model: grok-4.6
    label: "Grok 4.6 (xAI)"
    vision: true
    api: responses
    reasoning_efforts: [minimal, low, medium, high]
    # us-east-1 / us-west-2 only, so the global host rather than grok-4.3's
    # EU-pinned one.
    base_url: https://api.x.ai/v1
    # Standard tier, prompts <200k tokens; xAI bills the whole request at 2x
    # ($4.00/$1.00/$12.00) once a prompt reaches 200k.
    pricing: { input_per_1m: 2.00, cached_input_per_1m: 0.50, output_per_1m: 6.00 }
    priority:
      pricing: { input_per_1m: 4.00, cached_input_per_1m: 1.00, output_per_1m: 12.00 }
    extra: { temperature: 0.5 }
    builtin_tools: *xai_builtin_tools
  # xAI's current flagship (September 2026), and grok-4.6's price list unchanged
  # — same rates, same 500k context, same 2x band at 200k prompt tokens.
  #
  # PROBED 2026-09-22, and the probe disagrees with xAI's own docs, which is why
  # the list below is not the one they publish. They document low / medium /
  # high (default) / xhigh; `minimal` is in fact accepted, and was the cheapest
  # turn measured — 52 thinking tokens on "what is 17*24" against low's 60 and
  # high's 72 — so it leads the list and becomes the default a voice agent gets.
  # `none` is rejected ("This model does not support `reasoning_effort` value
  # `none`"), so like grok-4.5 and grok-4.6 every spoken turn pays some thinking
  # before the first word; grok-4.3 remains the only xAI model that can stop.
  #
  # `xhigh` is accepted by this model and deliberately not offered: nothing in a
  # voice pipeline wants the slowest setting, grok-4.6 takes it too without our
  # listing it, and `ReasoningEffort` stops at `high` for every provider.
  - provider: xai
    channel: [text, voice, video]
    model: grok-4.7
    label: "Grok 4.7 (xAI)"
    # Probed 2026-09-22: read "4731" off a 640x480 image, the same test every
    # other `vision: true` entry here passed.
    vision: true
    api: responses
    reasoning_efforts: [minimal, low, medium, high]
    # NOT grok-4.3's eu-west-1 host. That endpoint 404s this model outright
    # ("The model grok-4.7 does not exist or your team does not have access to
    # it", measured 2026-09-22) — it is served globally and from us.api.x.ai.
    base_url: https://api.x.ai/v1
    # Standard tier, prompts <200k tokens; xAI bills the whole request at 2x
    # ($4.00/$1.00/$12.00) once a prompt reaches 200k.
    pricing: { input_per_1m: 2.00, cached_input_per_1m: 0.50, output_per_1m: 6.00 }
    priority:
      pricing: { input_per_1m: 4.00, cached_input_per_1m: 1.00, output_per_1m: 12.00 }
    # temperature: same hallucinated-tool-call mitigation as the entries above,
    # and accepted alongside a thinking effort here (probed) — unlike gpt-5.6,
    # which 400s on the pair.
    extra: { temperature: 0.5 }
    builtin_tools: *xai_builtin_tools
  # `cache_write_per_1m` appears only on the GPT-5.6 and GPT-6 entries, and that
  # is the whole rule rather than an omission elsewhere: OpenAI charges for
  # WRITING the prompt cache from GPT-5.6 onward and not before it, at a flat
  # 1.25x the same lane's input rate (its own published rule, not a multiplier we invented
  # — the priority figures below are 1.25x the priority input rate for that
  # reason). Measured 2026-09-08 on /responses with a 1694-token prompt:
  # gpt-5.6-luna reports cache_write_tokens 1691 on the cold call and 0 on the
  # warm one, while gpt-5.4-nano and gpt-4.1-mini report 0 on both. xAI reports
  # none either. So a metered write with no rate here is a real gap, and
  # `price_llm_usage` quarantines the session rather than billing it at zero.
  # `warm_prompt_cache` makes one write on purpose at the start of every voice
  # call, so this is the common case and not an edge one.
  #
  # OpenAI's current flagship (GPT-6 Astra), and the most expensive model in this
  # catalog by a distance: $10/1M in and $50/1M out is 25x gpt-5.6-luna's rates
  # at the same 800-in/250-out minute the estimator assumes. Offered on voice
  # because the choice is the agent author's, not ours — but read the $/min the
  # editor shows before putting it on a phone line.
  #
  # PROBED 2026-09-22. The effort enum is a third spelling again: this model
  # rejects BOTH "none" and "minimal" ("Supported values are: 'low', 'medium',
  # 'high', 'xhigh', and 'max'"), where every GPT-5.x entry below takes "none"
  # and rejects "minimal". `low` measured zero thinking tokens on a trivial
  # prompt, so it is a usable floor rather than a nominal one; `xhigh` and `max`
  # are real values here and deliberately unoffered, as on grok-4.7 above.
  #
  # It also rejects `temperature` outright ("Unsupported parameter"), at every
  # effort rather than only while thinking — hence the empty `extra`, and one
  # more reason the xAI entries' temperature mitigation is declared per model.
  - provider: openai
    channel: [text, voice, video]
    model: gpt-6-astra
    label: "GPT-6 Astra (OpenAI)"
    # Probed 2026-09-22: read "4731" off a 640x480 image.
    vision: true
    api: responses
    # Its own list, NOT `*openai_reasoning_efforts` — see the probe above.
    reasoning_efforts: [low, medium, high]
    pricing: { input_per_1m: 10.00, cached_input_per_1m: 1.00, cache_write_per_1m: 12.50, output_per_1m: 50.00 }
    # `value: fast`, and the split is GENERATIONAL rather than per model. OpenAI
    # renamed the lane "Fast mode" on 2026-07-30 and takes either spelling on the
    # wire, but what it REPORTS back differs: asked for either `priority` or
    # `fast`, all three GPT-6 entries answer `service_tier: "fast"`, while
    # gpt-5.6-sol, gpt-5.6-luna and gpt-5.4 all still answer `priority` whichever
    # was asked (measured 2026-09-22 and 2026-09-23). Billing charges the tier the
    # response confirms, and `scripts/probe_service_tier.py` compares the two, so
    # the value we send has to be the one that comes back.
    priority:
      value: fast
      pricing: { input_per_1m: 20.00, cached_input_per_1m: 2.00, cache_write_per_1m: 25.00, output_per_1m: 100.00 }
    extra: {}
    # Anchored so every OpenAI entry below shares one definition. Note that the
    # same tool *name* is a different object at each provider: OpenAI requires a
    # container on code_interpreter and takes richer web-search filters, while
    # xAI's code interpreter takes no configuration at all.
    #
    # OpenAI documents that web search "does not support gpt-5 with minimal
    # reasoning" and that gpt-5.4 at effort "none" "may produce lower-quality
    # results" — and "none" is what these entries default to. Search still runs;
    # the caveat is quality, not a 400, and an author who cares about it can now
    # raise the effort on the model itself.
    builtin_tools: &openai_builtin_tools
      - type: web_search
        label: "Web search"
        description: >-
          Searches the live web and reads pages before answering, so the agent
          can talk about things that happened after the model was trained.
        price_note: "Billed by OpenAI at $10.00 per 1,000 searches, plus the tokens of everything it reads. Talqing's cost estimate does not include it."
        options:
          - key: allowed_domains
            path: [filters, allowed_domains]
            label: "Allowed domains"
            type: string_list
            max_items: 100
            description: "Subdomains are included. Leave off the https:// prefix."
          - key: search_context_size
            path: [search_context_size]
            label: "Search context size"
            type: enum
            choices: [low, medium, high]
            description: "More context is a better answer and more tokens. OpenAI's default is medium."
        # NOT offered: OpenAI's `user_location`, which biases results to a city.
        # It is an object discriminated by a constant `type: approximate`
        # sibling, and an option here writes one leaf at a time — so we would
        # either send that constant on every search or invent a way to send it
        # only alongside a location. Neither is worth it for a knob nobody has
        # asked for; add a proper option-group if one ever does.
        #
        # Also not offered: `blocked_domains`, `external_web_access`,
        # `return_token_budget`, `search_content_types` and `image_settings`.
        # They work on the wire but sit outside OpenAI's typed schema (their own
        # SDKs reach them through extra-field escape hatches), so they are a
        # documented-elsewhere risk we are not taking on a live call.
      - type: code_interpreter
        label: "Code interpreter"
        description: >-
          Writes and runs Python in a sandbox to work something out — arithmetic,
          dates, parsing — instead of guessing at it.
        price_note: "Billed by OpenAI per container session (from $0.03 per 20 minutes), not per run. Talqing's cost estimate does not include it."
        # OpenAI requires a container and we can only offer an auto-provisioned
        # one: a container id would have to be created in the tenant's OpenAI
        # account first. The memory option below writes inside this object.
        fixed: { container: { type: auto } }
        options:
          - key: memory_limit
            path: [container, memory_limit]
            label: "Memory limit"
            type: enum
            choices: [1g, 4g, 16g, 64g]
            description: "Larger tiers cost more per session. OpenAI's default is 1g."
      - type: file_search
        label: "File search"
        description: >-
          Searches a vector store you have uploaded to OpenAI. The store lives
          in your OpenAI account, and you create and fill it there.
        price_note: "Billed by OpenAI at $2.50 per 1,000 searches, plus OpenAI's storage. Talqing's cost estimate does not include it."
        options:
          - key: vector_store_ids
            path: [vector_store_ids]
            label: "Vector store IDs"
            type: string_list
            required: true
            description: "From platform.openai.com, e.g. vs_…"
          - key: max_num_results
            path: [max_num_results]
            label: "Max num results"
            type: integer
            description: "Between 1 and 50."
  # GPT-6 Sol, released 2026-09-23 alongside GPT-6 Luna — the rest of the family
  # Astra leads, and unlike Astra both can stop thinking, which is what makes
  # them usable on a voice turn. Only Sol is carried; see the note below it.
  #
  # PROBED 2026-09-23. Their effort enum is `none` / `low` / `medium` (the
  # provider default) / `high` / `xhigh` / `max`: `none` is accepted and measures
  # zero thinking tokens, `minimal` is rejected ("Supported values are: 'none',
  # 'low', 'medium', 'high', 'xhigh', and 'max'"), which is the GPT-5.x shape and
  # not Astra's — so these two share `*openai_reasoning_efforts` and Astra does
  # not. 1,050,000-token context on both.
  #
  # `temperature` behaves exactly as it does on gpt-5.6: accepted at effort
  # "none", rejected at any thinking effort ("Unsupported parameter"). Hence the
  # empty `extra`, and the standing warning against giving the CoPilot's model a
  # catalog temperature applies here too.
  #
  # `cache_write_per_1m` is set because both REPORT a write: 1957 write tokens on
  # a cold 1960-token prompt and 0 on the warm one, same as gpt-5.6-luna in the
  # same run. Note a 970-token prompt reports nothing on any of them — that is
  # under OpenAI's caching floor, not a model difference, and it is the trap to
