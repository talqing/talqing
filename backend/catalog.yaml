  # Gemini text LLMs launched within the last year (as of 2026-08). Specialized
  # image/live/TTS models are not catalogued here — agents need chat models.
  #
  # Every Gemini entry is `api: native`: the livekit-plugins-google client, not
  # the OpenAI plugin the other providers use. Google's compatibility layer
  # serves /chat/completions and no /responses at all, so a server-side tool had
  # nowhere to go — Search grounding, URL context and code execution are only
  # reachable on the native client, and they are the reason for the switch
  # (2026-08-08). It also stops flattening what Gemini reports: thinking is a
  # real `thinking_level`, not a translated `reasoning_effort`, and the plugin
  # round-trips Gemini's thought_signature itself.
  #
  # `base_url` and `supports_prompt_cache_key: false` below are NOT dead. The
  # LiveKit path no longer reads either, but `services/llm_client.py` — post-call
  # analysis, a plain AsyncOpenAI rather than a plugin — still
  # talks to the compatibility endpoint, and it is that endpoint which validates
  # the body against its own proto and 400s the whole call on a field it does not
  # know (`prompt_cache_key`, measured 2026-08-07). Nothing is lost by omitting
  # the key: Gemini caches implicitly for 2.5+ and takes no key on either path.
  #
  # Thinking. The native knob is `thinking_level`, whose enum is MINIMAL / LOW /
  # MEDIUM / HIGH — there is no "none", and sending one 400s. On the four
  # voice-capable entries `minimal` is the floor and measures ZERO thinking
  # tokens, so it is the `none` they used to carry under another name. Probed
  # live 2026-08-08 against generativelanguage.googleapis.com/v1beta/models/*:
  # generateContent, reading usageMetadata.thoughtsTokenCount (the native
  # endpoint reports it directly; the compatibility layer never did):
  #   model                  minimal  low  medium  high   none
  #   gemini-3.5-flash             0   47      56    82   400
  #   gemini-3.1-flash-lite        0   96      42    77   400
  #   gemini-3.6-flash             0   51      65    76   400
  #   gemini-3.5-flash-lite        0    0      70   101   400
  # gemini-3.7-flash and gemini-3.8-flash do not have that floor at all, which is
  # why they are the only text-only entries here — see their own note below.
  # Probe, never trust the doc, when adding a Gemini model: Google's thinking
  # docs disagreed with both endpoints, and the accepted values have moved once
  # already, and 3.7/3.8 dropped a value the four above all take.
  #
  # Removed 2026-08-01: gemini-2.5-flash-lite (API returns "no longer available to
  # new users") and gemini-3-flash-preview (9-11s for a trivial completion vs
  # 0.8-3s for every other Gemini — unusable on a voice turn).
  # gemini-3.8-flash and gemini-3.7-flash: the only two entries in this file
  # restricted to `channel: [text]`, and the reason is measured, not cautious.
  #
  # THEY CANNOT STOP THINKING. Both reject the `MINIMAL` thinking level outright
  # ("Thinking level MINIMAL is not supported for this model") — the level every
  # other Gemini here uses as its zero-thinking floor — so `low` is the floor,
  # and `low` thinks: 229 thinking tokens on 3.7 for a one-sentence reply. In the
  # same run, on the same prompt, a spoken-length answer took a median 1.86s on
  # gemini-3.5-flash and 2.56s on gemini-3.6-flash against 6.58s (3.7) and 6.46s
  # (3.8). That is the gemini-3-flash-preview case again, and it is why those two
  # were removed on 2026-08-01. Three of four calls in that run also returned 503
  # "experiencing high demand".
  #
  # Offered on text because none of that is disqualifying when nobody is waiting
  # on a silent line: these are Google's current Flash models, 3.8 is their
  # "most intelligent Flash", and an agent task or a chat agent can spend six
  # seconds. Re-measure before extending either to voice.
  #
  # `vision:` IS NOT PROBED on these two, and is false for that reason rather
  # than as a finding. Our key answers every request to both models with 429
  # ("You exceeded your current quota") — the same wall that removed
  # gemini-3.1-pro-preview, and the standing policy is that an unprobed model
  # does not get to claim it can see. Both almost certainly read images; prove it
  # on a key with quota and flip it then. The thinking levels above were measured
  # before the quota ran out; `medium` on 3.7 and `high` on 3.8 were each seen
  # only as a 503, which is capacity rather than a refusal.
  #
  # PRICE IS THE POST-PROMOTION RATE, deliberately. Google bills $0.75 in /
  # $0.075 cached / $3.75 out through 2026-12-31 and $1.50 / $0.15 / $7.50 from
  # 2027-01-01, and this file quotes the second — the same figures gemini-3.6-flash
  # has carried all along, under the same promotion. The estimate therefore reads
  # high until the new year rather than doubling on it.
  - provider: gemini
    channel: [text]
    model: gemini-3.8-flash
    label: "Gemini 3.8 Flash (Google)"
    vision: false
    api: native
    # Its own list, NOT `*gemini_reasoning_efforts`: no MINIMAL on this model.
    reasoning_efforts: [low, medium, high]
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    supports_prompt_cache_key: false
    # Google Maps (needs an auth config), File Search (needs stores hosted in the
    # tenant's Google account) and Vertex RAG (Vertex only) are not offered.
    #
    # ADDING A gemini-2.x ENTRY? These tools would silently do nothing on it
    # whenever the agent also has a function tool. `create_tools_config` DROPS
    # every provider tool from a mixed request unless the model is Gemini 3 on
    # the Developer API, and it drops them with a log warning and no error
    # (livekit/plugins/google/{llm.py,utils.py}, matched against the pinned
    # 1.8.2 line). An agent task always carries a function tool -- the generated
    # `submit_result` -- so on a 2.x entry `google_search` would never once run.
    # Every entry here is gemini-3.x and we do not use Vertex, so today this is
    # latent. Anything older needs the tools left off, or a guard built.
    builtin_tools: &gemini_builtin_tools
      - type: google_search
        label: "Google Search"
        description: >-
          Grounds the answer in live Google results, so the agent can talk about
          things that happened after the model was trained.
        price_note: "5,000 free search requests per month, shared across all Gemini 3.x models; then $14.00 per 1,000 requests, plus the tokens of everything it reads. Talqing's cost estimate does not include it."
        options:
          # The mirror image of OpenAI's `allowed_domains`: Google's tool filters
          # by exclusion, so this narrows nothing on its own — it only removes.
          # `path` is the field name on types.GoogleSearch, which is how the
          # native builder splats it (compiler/provider_tools.py).
          - key: exclude_domains
            path: [exclude_domains]
            label: "Excluded domains"
            type: string_list
            description: "Results from these domains are never used. Leave off the https:// prefix."
        # NOT offered: `blocking_confidence` (a PhishBlockThreshold enum) and
        # `time_range_filter` (an Interval object with two timestamps). Neither
        # is a flat value an option can write, and nobody has asked for either.
      - type: url_context
        label: "URL context"
        description: >-
          Fetches and reads any URL mentioned in the conversation, so the agent
          can answer about a page the caller names.
        price_note: "No separate charge — the fetched page is billed as input tokens at the model's rate."
      - type: code_execution
        label: "Code execution"
        description: >-
          Writes and runs Python server-side to work something out — arithmetic,
          dates, parsing — instead of guessing at it.
        price_note: "No separate charge — the generated code and its results are billed as ordinary input and output tokens at the model's rate."
    pricing: { input_per_1m: 1.50, cached_input_per_1m: 0.15, output_per_1m: 7.50 }
    priority:
      pricing: { input_per_1m: 2.70, cached_input_per_1m: 0.27, output_per_1m: 13.50 }
      confirms: false
    extra: {}
  # Same family, same price list, same missing MINIMAL — see the note above.
  # Google frames 3.7 as the everyday Flash and 3.8 as the more capable one.
  - provider: gemini
    channel: [text]
    model: gemini-3.7-flash
    label: "Gemini 3.7 Flash (Google)"
    vision: false
    api: native
    reasoning_efforts: [low, medium, high]
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    supports_prompt_cache_key: false
    builtin_tools: *gemini_builtin_tools
    pricing: { input_per_1m: 1.50, cached_input_per_1m: 0.15, output_per_1m: 7.50 }
    priority:
      pricing: { input_per_1m: 2.70, cached_input_per_1m: 0.27, output_per_1m: 13.50 }
      confirms: false
    extra: {}
  - provider: gemini
    channel: [text, voice, video]
    model: gemini-3.6-flash
    label: "Gemini 3.6 Flash (Google)"
    vision: true
    api: native
    reasoning_efforts: &gemini_reasoning_efforts [minimal, low, medium, high]
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    supports_prompt_cache_key: false
    builtin_tools: *gemini_builtin_tools
    # The standard rate, and not what Google charges today: the whole 3.x Flash
    # line is half price ($0.75 / $0.075 / $3.75) through 2026-12-31 and reverts
    # to exactly these figures on 2027-01-01 (checked 2026-09-22). Quoting the
    # standard rate keeps the estimate stable across that date at the cost of
    # reading 2x high until it. Same call as gpt-5.6-sol above, and it applies to
    # the 3.8 and 3.7 entries as well.
    pricing: { input_per_1m: 1.50, cached_input_per_1m: 0.15, output_per_1m: 7.50 }
    # A flat 1.8x across every Gemini model, and `confirms: false` on all of
    # them: Google's compatibility layer validates `service_tier` (a bogus value
    # 400s with "Valid values are: [default, auto, flex, priority]", measured
    # 2026-08-08) but returns no `service_tier` on the response. Google documents
    # an automatic downgrade to standard under load, so a downgraded Gemini turn
    # is invisible to us and still bills the tenant at 1.8x. That is the known
    # cost of offering the lane here.
    priority:
      pricing: { input_per_1m: 2.70, cached_input_per_1m: 0.27, output_per_1m: 13.50 }
      confirms: false
    extra: {}
  - provider: gemini
    channel: [text, voice, video]
    model: gemini-3.5-flash
    label: "Gemini 3.5 Flash (Google)"
    vision: true
    api: native
    reasoning_efforts: *gemini_reasoning_efforts
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    supports_prompt_cache_key: false
    builtin_tools: *gemini_builtin_tools
    pricing: { input_per_1m: 1.50, cached_input_per_1m: 0.15, output_per_1m: 9.00 }
    priority:
      pricing: { input_per_1m: 2.70, cached_input_per_1m: 0.27, output_per_1m: 16.20 }
      confirms: false
    extra: {}
  # Removed 2026-08-07: gemini-3.1-pro-preview. Every call on our key 429s
  # ("You exceeded your current quota") — a plain completion, not just a probe —
  # while gemini-3.5-flash on the same key answers, so the quota is zero for that
  # model rather than exhausted across the account. Two sweeps (08-01, 08-07)
