[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "talqing"
description = "Python client for the Talqing API"
readme = "README.md"
# 3.10, and verified there: the generated union aliases (`OperationRequest =
# HttpOperation | ...`) are evaluated at import, and `X | Y` between two classes
# is 3.10 — on 3.9 the package raises at `import talqing`. The previous `>=3.9`
# was never true either, for a different reason: it already imported
# `typing.Required`, which landed in 3.11. typing_extensions removes that half.
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "talqing" }]
keywords = ["talqing", "ai", "agents", "voice"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1", "typing-extensions>=4.12"]
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://talqing.com"

[tool.hatch.version]
path = "src/talqing/_version.py"

[tool.mypy]
# Strict, minus one rule. `warn_return_any` exists to catch `Any` leaking out by
# accident; here it is the design — a response is decoded JSON, and the
# TypedDict a method declares is the document's description of it, not a proof.
# A `cast` at three hundred generated call sites would restate that decision
# three hundred times and check nothing.
strict = true
warn_return_any = false
files = ["src/talqing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# So `pytest` works in a fresh checkout without installing the package first.
pythonpath = ["src"]
