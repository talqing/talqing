; One pgbouncer in front of both Postgres planes, shared by every Python
; container: api, voice-worker, text-worker, background-worker, job-scheduler.
; code-exec is Node and touches no database.
;
; It exists for voice-worker: that container runs one LiveKit job process per
; call and the process exits when the call does, so its two Postgres
; connections are never amortized and the connection count scales with
; concurrent calls. Transaction pooling holds a server connection for the
; duration of a transaction instead.
;
; Containers reach the proxy because TALQING_PG_PROXY is set on them; unset it
; and they connect directly again, which is the rollback for all of this. A
; `psql` aimed at control-pg/data-pg from a shell bypasses the proxy, and that
; is intended.

[databases]
; pgbouncer is the routing table. The DSN rewrite in db/pool.py changes only
; host and port, so the DATABASE NAME is what decides which server a connection
; reaches. A second data plane on another host is a new entry here and no
; application change at all.
;
; No `user=` on either line, deliberately: setting one would force every client
; onto a single server-side identity and would disqualify the SCRAM
; pass-through escape hatch (auth_user + auth_query) if the two planes ever
; need distinct credentials.
;
; `pool_size` IS the maximum — there is no `max_pool_size` in pgbouncer. The
; names do not line up with asyncpg's, which is worth knowing before someone
; goes looking for the setting that is not there:
;     asyncpg min_size -> pgbouncer min_pool_size
;     asyncpg max_size -> pgbouncer pool_size
; Stated explicitly rather than inherited from `default_pool_size` (20): this
; is the platform's connection ceiling, and the two
; planes carry genuinely different load. Both are well under the servers'
; max_connections of 100.
talqing_control = host=control-pg port=5432 dbname=talqing_control pool_size=15
talqing_data    = host=data-pg    port=5432 dbname=talqing_data    pool_size=40 min_pool_size=2

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; The whole point: a server connection is held only for the duration of a
; transaction. asyncpg's statement cache is disabled whenever TALQING_PG_PROXY
; is set, because a named prepared statement does not survive the backend being
; swapped between transactions.
pool_mode = transaction

; One entry per username, used BOTH to verify the client and to log in to the
; server — which is why both planes share one Postgres password. `pgb_stats`
; exists only to read SHOW output and has no Postgres role.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
stats_users = pgb_stats

; Ceiling on client connections across every app, sized for the busiest:
; voice-worker runs one job process per call, each holding up to
; pool_max_size (10) client connections per plane.
max_client_conn = 1000

; A live call must fail loudly rather than hang. pgbouncer's default is 120s,
; which on a phone call is silence the caller sits through.
query_wait_timeout = 10

; Two lines per client connection, and every client here is a machine: the
; healthcheck reconnects every 5s and pgbouncer-exporter every 15s, which alone
; was ~40 lines a minute saying nothing. Failed logins, server-side errors and
; the periodic `stats:` line are NOT gated by these.
log_connections = 0
log_disconnections = 0

server_idle_timeout = 600
server_lifetime = 3600

; `server_reset_query` is deliberately NOT set. Its default (DISCARD ALL) is
; skipped in transaction pooling unless `server_reset_query_always` is turned
; on, and there is nothing to reset anyway: the backend sets no session GUCs,
; uses no LISTEN/NOTIFY, no WITH HOLD cursors, no SQL-level PREPARE, no temp
; tables and no session-level advisory locks (the migration lock is Redis).

ignore_startup_parameters = extra_float_digits,options
